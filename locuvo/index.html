<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locuvo - Select Language</title>
    <style>
        :root { --bg-cream: #fdfaf5; --main-text: #333; --accent-color: #d4a373; }
        body { margin: 0; font-family: sans-serif; background-color: var(--bg-cream); color: var(--main-text); display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
        .container { max-width: 600px; padding: 20px; }
        .app-icon { font-size: 72px; margin-bottom: 12px; }
        h1 { font-size: 1.5rem; letter-spacing: 2px; margin-bottom: 10px; }
        .subtitle { color: #888; font-size: .9rem; margin-bottom: 30px; }
        .lang-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; }
        .lang-btn { background: #fff; border: 1px solid #eee; padding: 12px; border-radius: 8px; text-decoration: none; color: #555; font-weight: bold; transition: 0.3s; }
        .lang-btn:hover { background: var(--accent-color); color: #fff; transform: translateY(-3px); }
        .footer { margin-top: 40px; font-size: 0.8rem; color: #aaa; }
        .footer a { color: #aaa; }
    </style>
    <script>
        (function() {
            // URLに ?select=true がついている場合は転送しない（無限ループ防止）
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('select') === 'true') return;

            // 言語判定と転送（日本語→日本語マニュアル／それ以外→英語マニュアル。言語追加時はlangMapへ追記）
            const browserLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
            const langKey = browserLang.split('-')[0];
            const langMap = {
                'ja': 'manual_ja/intro_ja.html'
            };

            const target = langMap[langKey] || 'manual_en/intro_en.html';

            // 転送実行
            window.location.replace(target);
        })();
    </script>
</head>
<body>
    <div class="container">
        <div class="app-icon">🧭</div>
        <h1>Locuvo</h1>
        <div class="subtitle">Select Language / 言語を選択</div>
        <div class="lang-grid">
            <a href="manual_ja/intro_ja.html" class="lang-btn">JP 日本語</a>
            <a href="manual_en/intro_en.html" class="lang-btn">US English</a>
        </div>
        <div class="footer">&copy; 2026 RayAppLab | <a href="privacy-policy.html">Privacy Policy</a></div>
    </div>
</body>
</html>
